<!doctype html>
<html lang="es" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Confirmados · Ana Isabela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Manrope:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="styles.css?v=20260729-excel">
  <style>
    .admin-table-wrap th:first-child,
    .admin-table-wrap td:first-child { width: 3.5rem; text-align: center; font-variant-numeric: tabular-nums; }
    .admin-table-wrap th:nth-child(3),
    .admin-table-wrap td:nth-child(3) { text-align: center; }
    .admin-table-wrap td:nth-child(2) { text-align: left; }
    .admin-sort { display: inline-flex; align-items: center; gap: .35rem; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
    .admin-sort:focus-visible { outline: 2px solid var(--gold); outline-offset: .3rem; }
    .admin-sort__indicator { font-size: .85rem; }
    .pass-button { min-width: 8rem; padding: .7rem .9rem; border: 1px solid var(--gold); background: transparent; color: inherit; font: 600 .56rem/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
    .pass-button:hover { background: var(--gold); color: var(--paper); }
    .pass-button:disabled { cursor: wait; opacity: .55; }
    .pass-preview[hidden] { display: none; }
    .pass-preview { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 1rem; background: rgba(29,25,24,.72); }
    .pass-preview__panel { position: relative; width: min(540px,100%); max-height: calc(100vh - 2rem); overflow: auto; padding: 1.25rem; background: var(--paper); box-shadow: 0 1.5rem 5rem rgba(0,0,0,.28); }
    .pass-preview__close { position: absolute; top: .6rem; right: .6rem; z-index: 1; width: 2.5rem; height: 2.5rem; border: 1px solid rgba(25,23,23,.28); border-radius: 50%; background: var(--paper); color: inherit; font-size: 1.4rem; cursor: pointer; }
    .pass-preview h2 { margin: .4rem 3rem 1rem 0; font: 400 2rem/1 var(--serif); }
    .pass-preview img { display: block; width: min(100%,360px); margin: 0 auto; border: 1px solid rgba(25,23,23,.14); }
    .pass-preview__actions { display: grid; gap: .75rem; margin-top: 1.25rem; }
    .pass-preview__actions .button { width: 100%; margin: 0; }
    .pass-preview__note { margin: 1rem 0 0; font-size: .72rem; line-height: 1.5; text-align: center; }
  </style>
</head>
<body class="admin-page">
  <main class="admin-shell">
    <header class="admin-header">
      <p class="eyebrow">Ana Isa · Mis XV años</p>
      <h1>Lista de<br><em>confirmados</em></h1>
      <p>Panel privado de confirmaciones.</p>
    </header>

    <section class="admin-login" id="admin-login" aria-labelledby="login-title">
      <h2 id="login-title">Acceso</h2>
      <form id="admin-login-form">
        <label class="rsvp-field">
          <span>Clave de administración</span>
          <input type="password" id="admin-token" autocomplete="current-password" required>
        </label>
        <p class="admin-status" id="admin-login-status" role="status"></p>
        <button class="button button--dark" type="submit">Ver confirmados</button>
      </form>
    </section>

    <section class="admin-dashboard" id="admin-dashboard" hidden>
      <div class="admin-totals">
        <article><span>Confirmaciones</span><strong id="total-confirmations">0</strong></article>
        <article><span>Personas confirmadas</span><strong id="total-people">0</strong></article>
      </div>
      <div class="admin-actions">
        <button class="button" id="refresh-list" type="button">Actualizar lista</button>
        <button class="button button--dark" id="download-excel" type="button" disabled>Descargar Excel</button>
        <button class="button" id="close-session" type="button">Cerrar sesión</button>
      </div>
      <p class="admin-status" id="admin-status" role="status"></p>
      <div class="admin-table-wrap">
        <table>
          <thead><tr><th scope="col" id="number-heading" aria-sort="descending"><button class="admin-sort" id="sort-by-number" type="button">N.º <span class="admin-sort__indicator" id="sort-indicator" aria-hidden="true">↓</span></button></th><th scope="col">Nombre</th><th scope="col">Personas</th><th scope="col">Celular</th><th scope="col">Confirmado</th><th scope="col">Pase</th></tr></thead>
          <tbody id="rsvp-list"></tbody>
        </table>
      </div>
    </section>
  </main>
  <div class="pass-preview" id="pass-preview" role="dialog" aria-modal="true" aria-labelledby="pass-preview-title" hidden>
    <div class="pass-preview__panel">
      <button class="pass-preview__close" id="close-pass-preview" type="button" aria-label="Cerrar vista previa">×</button>
      <h2 id="pass-preview-title">Pase listo para compartir</h2>
      <img id="pass-preview-image" alt="Vista previa del pase de entrada generado">
      <div class="pass-preview__actions">
        <button class="button button--dark" id="save-pass" type="button">Guardar imagen</button>
        <button class="button" id="share-pass" type="button">Compartir por WhatsApp</button>
      </div>
      <p class="pass-preview__note" id="pass-preview-note">En celular podrás elegir WhatsApp desde el menú para compartir.</p>
    </div>
  </div>
  <script>
    (function () {
      'use strict';
      const endpoint = 'https://rsvp.juancarlosnieves.mx/api/admin/rsvps';
      const login = document.getElementById('admin-login');
      const form = document.getElementById('admin-login-form');
      const loginStatus = document.getElementById('admin-login-status');
      const dashboard = document.getElementById('admin-dashboard');
      const status = document.getElementById('admin-status');
      const list = document.getElementById('rsvp-list');
      const downloadExcel = document.getElementById('download-excel');
      const numberHeading = document.getElementById('number-heading');
      const sortIndicator = document.getElementById('sort-indicator');
      const passPreview = document.getElementById('pass-preview');
      const passPreviewImage = document.getElementById('pass-preview-image');
      const passPreviewNote = document.getElementById('pass-preview-note');
      let token = '';
      let currentRsvps = [];
      let sortDirection = 'desc';
      let currentPass = null;
      let currentPassUrl = '';

      function formatDate(value, includeWeekday) {
        const options = {
          day: 'numeric',
          month: 'long',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        };
        if (includeWeekday) options.weekday = 'long';
        const formatted = new Intl.DateTimeFormat('es-MX', options).format(new Date(value));
        return formatted.charAt(0).toUpperCase() + formatted.slice(1);
      }

      function escapeXml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&apos;');
      }

      function registrationNumbers(items) {
        const ordered = items.slice().sort(function (a, b) {
          const dateDifference = new Date(a.createdAt).getTime() - new Date(b.createdAt).getTime();
          if (dateDifference !== 0) return dateDifference;
          return String(a.id || a.phone).localeCompare(String(b.id || b.phone));
        });
        const numbers = new Map();
        ordered.forEach(function (item, index) {
          numbers.set(item.id || item.phone, index + 1);
        });
        return numbers;
      }

      function orderedRsvps(items, numbers) {
        const direction = sortDirection === 'asc' ? 1 : -1;
        return items.slice().sort(function (a, b) {
          return (numbers.get(a.id || a.phone) - numbers.get(b.id || b.phone)) * direction;
        });
      }

      function updateSortControl() {
        const ascending = sortDirection === 'asc';
        numberHeading.setAttribute('aria-sort', ascending ? 'ascending' : 'descending');
        sortIndicator.textContent = ascending ? '↑' : '↓';
      }

      function loadPassImage() {
        return new Promise(function (resolve, reject) {
          const image = new Image();
          image.onload = function () { resolve(image); };
          image.onerror = reject;
          image.src = '../assets/images/ana-isabela-7380-1800.jpg';
        });
      }

      function drawCover(context, image, x, y, width, height) {
        const scale = Math.max(width / image.width, height / image.height);
        const sourceWidth = width / scale;
        const sourceHeight = height / scale;
        const sourceX = (image.width - sourceWidth) / 2;
        const sourceY = (image.height - sourceHeight) / 2;
        context.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, x, y, width, height);
      }

      function wrapCentered(context, text, centerX, startY, maxWidth, lineHeight) {
        const words = String(text).split(/\s+/);
        const lines = [];
        let line = '';
        words.forEach(function (word) {
          const test = line ? line + ' ' + word : word;
          if (context.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = word;
          } else {
            line = test;
          }
        });
        if (line) lines.push(line);
        const firstY = startY - ((lines.length - 1) * lineHeight) / 2;
        lines.forEach(function (item, index) {
          context.fillText(item, centerX, firstY + index * lineHeight);
        });
      }

      async function createPassBlob(item, number) {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        const portrait = await loadPassImage();
        const canvas = document.createElement('canvas');
        canvas.width = 1080;
        canvas.height = 1920;
        const context = canvas.getContext('2d');
        const ivory = '#f6f0eb';
        const ink = '#1d1918';
        const gold = '#a98655';

        context.fillStyle = ivory;
        context.fillRect(0, 0, canvas.width, canvas.height);
        drawCover(context, portrait, 0, 0, 1080, 760);
        const fade = context.createLinearGradient(0, 390, 0, 780);
        fade.addColorStop(0, 'rgba(29,25,24,0)');
        fade.addColorStop(1, ivory);
        context.fillStyle = fade;
        context.fillRect(0, 390, 1080, 390);

        context.textAlign = 'center';
        context.fillStyle = ink;
        context.font = '600 28px Manrope, sans-serif';
        context.letterSpacing = '8px';
        context.fillText('PASE DE ENTRADA', 540, 820);
        context.letterSpacing = '0px';

        context.fillStyle = gold;
        context.font = '400 104px "Bodoni Moda", serif';
        context.fillText('Ana Isabela', 540, 950);
        context.font = 'italic 400 74px "Bodoni Moda", serif';
        context.fillText('Mis XV años', 540, 1040);

        context.strokeStyle = gold;
        context.lineWidth = 2;
        context.beginPath();
        context.moveTo(130, 1100);
        context.lineTo(950, 1100);
        context.stroke();

        context.fillStyle = ink;
        context.font = '300 30px Manrope, sans-serif';
        context.fillText('INVITACIÓN PARA', 540, 1180);
        context.font = '400 64px "Bodoni Moda", serif';
        wrapCentered(context, item.name, 540, 1280, 820, 72);

        context.fillStyle = gold;
        context.font = '600 32px Manrope, sans-serif';
        context.fillText(item.partySize === 1 ? 'ACCESO PARA 1 PERSONA' : 'ACCESO PARA ' + item.partySize + ' PERSONAS', 540, 1430);

        context.fillStyle = ink;
        context.font = '400 42px "Bodoni Moda", serif';
        context.fillText('Sábado 3 de octubre de 2026 · 7:00 p. m.', 540, 1530);
        context.font = '300 26px Manrope, sans-serif';
        context.fillText('SALÓN DE EVENTOS VILLA CONÍN · SOLAR DE CONÍN', 540, 1590);
        context.fillText('Carretera Querétaro–México, Km 204.5', 540, 1635);

        context.strokeStyle = gold;
        context.strokeRect(335, 1705, 410, 92);
        context.fillStyle = ink;
        context.font = '600 25px Manrope, sans-serif';
        context.fillText('FOLIO  AI-' + String(number).padStart(3, '0'), 540, 1763);
        context.font = '300 21px Manrope, sans-serif';
        context.fillText('Presenta este pase al ingresar · Uso personal', 540, 1855);

        return new Promise(function (resolve, reject) {
          canvas.toBlob(function (blob) {
            if (blob) resolve(blob); else reject(new Error('No fue posible generar la imagen.'));
          }, 'image/png');
        });
      }

      function downloadPass() {
        if (!currentPass) return;
        const link = document.createElement('a');
        link.href = currentPassUrl;
        link.download = currentPass.file.name;
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      function whatsappPhone(value) {
        const digits = String(value || '').replace(/\D/g, '');
        return digits.length === 10 ? '52' + digits : digits;
      }

      function closePassPreview() {
        passPreview.hidden = true;
        document.body.style.overflow = '';
        passPreviewImage.removeAttribute('src');
        if (currentPassUrl) URL.revokeObjectURL(currentPassUrl);
        currentPassUrl = '';
        currentPass = null;
      }

      function showPassPreview(blob, item, number) {
        if (currentPassUrl) URL.revokeObjectURL(currentPassUrl);
        const safeName = item.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        const fileName = 'pase-ana-isa-' + safeName + '.png';
        currentPassUrl = URL.createObjectURL(blob);
        currentPass = {
          blob: blob,
          file: new File([blob], fileName, { type: 'image/png' }),
          item: item,
          number: number
        };
        passPreviewImage.src = currentPassUrl;
        passPreviewNote.textContent = 'Pase ' + String(number).padStart(3, '0') + ' · ' + item.name;
        passPreview.hidden = false;
        document.body.style.overflow = 'hidden';
        document.getElementById('save-pass').focus();
      }

      async function sharePass() {
        if (!currentPass) return;
        const shareData = {
          files: [currentPass.file],
          title: 'Pase de entrada · Ana Isa',
          text: 'Te compartimos tu pase de entrada para los XV años de Ana Isa.'
        };
        try {
          if (navigator.share && navigator.canShare && navigator.canShare({ files: shareData.files })) {
            await navigator.share(shareData);
            return;
          }
          downloadPass();
          const phone = whatsappPhone(currentPass.item.phone);
          const message = 'Hola, te comparto tu pase de entrada para los XV años de Ana Isa. La imagen se descargó para que puedas adjuntarla en este chat.';
          window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(message), '_blank', 'noopener');
          passPreviewNote.textContent = 'La imagen se guardó. Adjunta el archivo descargado en el chat de WhatsApp que se abrió.';
        } catch (error) {
          if (error.name !== 'AbortError') passPreviewNote.textContent = error.message || 'No fue posible compartir el pase.';
        }
      }

      async function deliverPass(item, number, button) {
        const originalText = button.textContent;
        button.disabled = true;
        button.textContent = 'Generando…';
        try {
          const blob = await createPassBlob(item, number);
          showPassPreview(blob, item, number);
        } catch (error) {
          if (error.name !== 'AbortError') status.textContent = error.message || 'No fue posible generar el pase.';
        } finally {
          button.disabled = false;
          button.textContent = originalText;
        }
      }

      function render(data) {
        currentRsvps = data.rsvps || [];
        const numbers = registrationNumbers(currentRsvps);
        const visibleRsvps = orderedRsvps(currentRsvps, numbers);
        document.getElementById('total-confirmations').textContent = String(data.totalConfirmations || 0);
        document.getElementById('total-people').textContent = String(data.totalPeople || 0);
        downloadExcel.disabled = currentRsvps.length === 0;
        list.replaceChildren();
        updateSortControl();
        visibleRsvps.forEach(function (item) {
          const row = document.createElement('tr');
          [String(numbers.get(item.id || item.phone)), item.name, String(item.partySize), item.phone, formatDate(item.updatedAt, false)]
            .forEach(function (value) {
              const cell = document.createElement('td');
              cell.textContent = value;
              row.appendChild(cell);
            });
          const passCell = document.createElement('td');
          const passButton = document.createElement('button');
          passButton.className = 'pass-button';
          passButton.type = 'button';
          passButton.textContent = 'Generar pase';
          passButton.addEventListener('click', function () {
            deliverPass(item, numbers.get(item.id || item.phone), passButton);
          });
          passCell.appendChild(passButton);
          row.appendChild(passCell);
          list.appendChild(row);
        });
        if (!data.rsvps || !data.rsvps.length) {
          const row = document.createElement('tr');
          const cell = document.createElement('td');
          cell.colSpan = 6;
          cell.textContent = 'Aún no hay confirmaciones.';
          row.appendChild(cell);
          list.appendChild(row);
        }
      }

      async function loadRsvps() {
        status.textContent = 'Actualizando…';
        const response = await fetch(endpoint, {
          headers: { Authorization: 'Bearer ' + token }
        });
        const data = await response.json().catch(function () { return {}; });
        if (!response.ok) throw new Error(data.message || 'No fue posible consultar la lista.');
        render(data);
        status.textContent = 'Última actualización: ' + formatDate(new Date(), true);
      }

      function downloadAsExcel() {
        if (!currentRsvps.length) return;
        const numbers = registrationNumbers(currentRsvps);
        const rows = orderedRsvps(currentRsvps, numbers).map(function (item) {
          return '<Row>' +
            '<Cell><Data ss:Type="Number">' + numbers.get(item.id || item.phone) + '</Data></Cell>' +
            '<Cell><Data ss:Type="String">' + escapeXml(item.name) + '</Data></Cell>' +
            '<Cell><Data ss:Type="Number">' + Number(item.partySize) + '</Data></Cell>' +
            '<Cell><Data ss:Type="String">' + escapeXml(item.phone) + '</Data></Cell>' +
            '<Cell><Data ss:Type="String">' + escapeXml(formatDate(item.updatedAt, false)) + '</Data></Cell>' +
          '</Row>';
        }).join('');
        const workbook = '<?xml version="1.0"?>' +
          '<?mso-application progid="Excel.Sheet"?>' +
          '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" ' +
          'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +
          '<Worksheet ss:Name="Confirmados"><Table>' +
          '<Row>' +
          '<Cell><Data ss:Type="String">N.º</Data></Cell>' +
          '<Cell><Data ss:Type="String">NOMBRE</Data></Cell>' +
          '<Cell><Data ss:Type="String">PERSONAS</Data></Cell>' +
          '<Cell><Data ss:Type="String">CELULAR</Data></Cell>' +
          '<Cell><Data ss:Type="String">CONFIRMADO</Data></Cell>' +
          '</Row>' + rows + '</Table></Worksheet></Workbook>';
        const blob = new Blob([workbook], { type: 'application/vnd.ms-excel;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'confirmados-ana-isa-' + new Date().toISOString().slice(0, 10) + '.xls';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        token = document.getElementById('admin-token').value;
        loginStatus.textContent = 'Verificando…';
        try {
          await loadRsvps();
          login.hidden = true;
          dashboard.hidden = false;
          loginStatus.textContent = '';
        } catch (error) {
          token = '';
          loginStatus.textContent = error.message;
        }
      });

      document.getElementById('refresh-list').addEventListener('click', function () {
        loadRsvps().catch(function (error) { status.textContent = error.message; });
      });
      downloadExcel.addEventListener('click', downloadAsExcel);
      document.getElementById('save-pass').addEventListener('click', downloadPass);
      document.getElementById('share-pass').addEventListener('click', sharePass);
      document.getElementById('close-pass-preview').addEventListener('click', closePassPreview);
      passPreview.addEventListener('click', function (event) {
        if (event.target === passPreview) closePassPreview();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && !passPreview.hidden) closePassPreview();
      });
      document.getElementById('sort-by-number').addEventListener('click', function () {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
        render({
          rsvps: currentRsvps,
          totalConfirmations: currentRsvps.length,
          totalPeople: currentRsvps.reduce(function (sum, item) { return sum + Number(item.partySize || 0); }, 0)
        });
      });
      document.getElementById('close-session').addEventListener('click', function () {
        token = '';
        currentRsvps = [];
        downloadExcel.disabled = true;
        document.getElementById('admin-token').value = '';
        dashboard.hidden = true;
        login.hidden = false;
      });
    }());
  </script>
</body>
</html>
