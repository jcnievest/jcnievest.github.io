<!doctype html>
<html lang="es" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Confirmados · Ana Isabela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Manrope:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="styles.css?v=20260727">
</head>
<body class="admin-page">
  <main class="admin-shell">
    <header class="admin-header">
      <p class="eyebrow">Ana Isa · Mis XV años</p>
      <h1>Lista de<br><em>confirmados</em></h1>
      <p>Panel privado de confirmaciones.</p>
    </header>

    <section class="admin-login" id="admin-login" aria-labelledby="login-title">
      <h2 id="login-title">Acceso</h2>
      <form id="admin-login-form">
        <label class="rsvp-field">
          <span>Clave de administración</span>
          <input type="password" id="admin-token" autocomplete="current-password" required>
        </label>
        <p class="admin-status" id="admin-login-status" role="status"></p>
        <button class="button button--dark" type="submit">Ver confirmados</button>
      </form>
    </section>

    <section class="admin-dashboard" id="admin-dashboard" hidden>
      <div class="admin-totals">
        <article><span>Confirmaciones</span><strong id="total-confirmations">0</strong></article>
        <article><span>Personas confirmadas</span><strong id="total-people">0</strong></article>
      </div>
      <div class="admin-actions">
        <button class="button" id="refresh-list" type="button">Actualizar lista</button>
        <button class="button" id="close-session" type="button">Cerrar sesión</button>
      </div>
      <p class="admin-status" id="admin-status" role="status"></p>
      <div class="admin-table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Personas</th><th>Celular</th><th>Confirmado</th></tr></thead>
          <tbody id="rsvp-list"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    (function () {
      'use strict';
      const endpoint = 'https://rsvp.juancarlosnieves.mx/api/admin/rsvps';
      const login = document.getElementById('admin-login');
      const form = document.getElementById('admin-login-form');
      const loginStatus = document.getElementById('admin-login-status');
      const dashboard = document.getElementById('admin-dashboard');
      const status = document.getElementById('admin-status');
      const list = document.getElementById('rsvp-list');
      let token = '';

      function render(data) {
        document.getElementById('total-confirmations').textContent = String(data.totalConfirmations || 0);
        document.getElementById('total-people').textContent = String(data.totalPeople || 0);
        list.replaceChildren();
        (data.rsvps || []).forEach(function (item) {
          const row = document.createElement('tr');
          [item.name, String(item.partySize), item.phone, new Date(item.updatedAt).toLocaleString('es-MX')]
            .forEach(function (value) {
              const cell = document.createElement('td');
              cell.textContent = value;
              row.appendChild(cell);
            });
          list.appendChild(row);
        });
        if (!data.rsvps || !data.rsvps.length) {
          const row = document.createElement('tr');
          const cell = document.createElement('td');
          cell.colSpan = 4;
          cell.textContent = 'Aún no hay confirmaciones.';
          row.appendChild(cell);
          list.appendChild(row);
        }
      }

      async function loadRsvps() {
        status.textContent = 'Actualizando…';
        const response = await fetch(endpoint, {
          headers: { Authorization: 'Bearer ' + token }
        });
        const data = await response.json().catch(function () { return {}; });
        if (!response.ok) throw new Error(data.message || 'No fue posible consultar la lista.');
        render(data);
        status.textContent = 'Última actualización: ' + new Date().toLocaleTimeString('es-MX');
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        token = document.getElementById('admin-token').value;
        loginStatus.textContent = 'Verificando…';
        try {
          await loadRsvps();
          login.hidden = true;
          dashboard.hidden = false;
          loginStatus.textContent = '';
        } catch (error) {
          token = '';
          loginStatus.textContent = error.message;
        }
      });

      document.getElementById('refresh-list').addEventListener('click', function () {
        loadRsvps().catch(function (error) { status.textContent = error.message; });
      });
      document.getElementById('close-session').addEventListener('click', function () {
        token = '';
        document.getElementById('admin-token').value = '';
        dashboard.hidden = true;
        login.hidden = false;
      });
    }());
  </script>
</body>
</html>
